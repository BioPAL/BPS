#
# Pytest markers used by the BIOMASS BPS CI workflow.
#
# Current model (single workflow):
# - baseline: executed by `.github/workflows/ci.yml` in Baseline marker signal.
# - extended: executed by `.github/workflows/ci.yml` when tier is 1.
# - heavy: executed when tier is 2 (VERSION→main, tier_2_paths, or run_heavy on dispatch).
#
# Legacy markers (`unit`, `smoke`, `integration`, `public`) are kept for
# compatibility with existing tests.

[pytest]
testpaths = test/baseline test/extended test/heavy
markers =
    unit: unit tests (fast, isolated)
    smoke: smoke tests
    integration: integration tests
    public: tests safe to run on public datasets
    baseline: baseline signal tests used by ci.yml tier computation
    extended: tier-1 extended validation tests executed by ci.yml
    heavy: optional tier-1 heavy validation tests executed by ci.yml with run_heavy=true
