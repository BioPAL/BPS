line-length = 120
output-format = "concise"
target-version = "py312"
required-version = "0.17.4"

[format]
docstring-code-format = true
line-ending = "lf"

[lint.per-file-ignores]
"models.py" = ["F401", "F811", "E741"]
"*l1_framing_processor/*/models.py" = ["UP"]
"__init__.py" = ["F401"]
"__main__.py" = ["BLE001"]
