name: bps-l1_framing_processor CI
on:
  push:
    branches: ["**"]
    tags: ["bps-v*"]
    paths:
      [
        "bps-l1_framing_processor/**",
        ".github/workflows/bps-l1_framing_processor.yml",
        ".github/workflows/python-package-reusable.yml",
        ".github/actions/install-subpackage/action.yml",
        "ruff.toml",
        "scripts/fawltydeps.toml",
      ]
  pull_request:
    paths:
      [
        "bps-l1_framing_processor/**",
        ".github/workflows/bps-l1_framing_processor.yml",
        ".github/workflows/python-package-reusable.yml",
        ".github/actions/install-subpackage/action.yml",
        "ruff.toml",
        "scripts/fawltydeps.toml",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/python-package-reusable.yml
    with:
      subproject: bps-l1_framing_processor
      source-path: bps/l1_framing_processor
      local-dependencies: ../bps-common ../bps-transcoder
      run-tests: false
