name: bps-l1_geocoding_tool CI
on:
  push:
    branches: ["**"]
    tags: ["l1_geocoding_tool-v*"]
    paths:
      [
        "bps-l1_geocoding_tool/**",
        "bps-common/**",
        "bps-transcoder/**",
        ".github/workflows/bps-l1_geocoding_tool.yml",
        ".github/workflows/python-package-reusable.yml",
        ".github/actions/install-subpackage/action.yml",
        "ruff.toml",
        "scripts/fawltydeps.toml",
      ]
  pull_request:
    paths:
      [
        "bps-l1_geocoding_tool/**",
        "bps-common/**",
        "bps-transcoder/**",
        ".github/workflows/bps-l1_geocoding_tool.yml",
        ".github/workflows/python-package-reusable.yml",
        ".github/actions/install-subpackage/action.yml",
        "ruff.toml",
        "scripts/fawltydeps.toml",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/python-package-reusable.yml
    with:
      subproject: bps-l1_geocoding_tool
      source-path: bps/l1_geocoding_tool
      local-dependencies: ../bps-common ../bps-transcoder
      conda-dependencies: biomass-bps::arepyextras-runner biomass-bps::arepyextras-copernicus_dem_extractor
