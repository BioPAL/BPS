spec:
  inputs:
    bps-full-build:
      type: boolean
      default: false
    test-plan-version:
      type: string
      default: ""
---

.tags_bps_ci_rocky8:
  tags:
    - bps
    - rocky8
    - conda
  stage: testplan

.variables_testplan:
  variables:
    TEST_PLAN_VERSION: '$[[ inputs.test-plan-version ]]'

.get_test_plan:
  before_script:
    - test -n "$TEST_PLAN_VERSION" || { echo "TEST_PLAN_VERSION is required";
      exit 1; }
    - mkdir -p ${INTERNAL_TEST_PLAN_ROOT} && cd ${INTERNAL_TEST_PLAN_ROOT}
    - git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@${INTERNAL_TEST_PLAN_REPO_BASE}" test_plan
    - cd test_plan && git checkout $TEST_PLAN_VERSION
    - ln -s ${INTERNAL_TDS_ROOT} tds
    - sed -i "s|^BPS_PYTHON_ENV=.*|BPS_PYTHON_ENV=pipeline-$CI_PIPELINE_ID|" tools/scripts/set_environment.bash
    - sed -i "s|conda activate \${BPS_PYTHON_ENV}|conda activate ${INTERNAL_PIPELINES_DATA_ROOT}/conda_envs/\${BPS_PYTHON_ENV}|" tools/scripts/set_environment.bash

.testplan_enabled:
  rules:
    - if: '"$[[ inputs.bps-full-build ]]" == "true" && "$[[ inputs.test-plan-version ]]" != ""'

.run_test:
  extends:
    - .tags_bps_ci_rocky8
  script:
    - TEST_NAME="TEST-BPS-${TEST_NAME}"
    - mkdir -p ${INTERNAL_TEST_PLAN_ROOT}/test_plan/tools/install_dir
    - cp -r $CI_PROJECT_DIR/bps-dockerfiles/bundle ${INTERNAL_TEST_PLAN_ROOT}/test_plan/tools/install_dir
    - set +e
    - set -o pipefail
    - cd ${INTERNAL_TEST_PLAN_ROOT}/test_plan/test_cases/$TEST_NAME
    - |
      ./run.bash --sta-skip-dockers 2>&1 | tee log_TEST-$TEST_NAME.txt; exit_code=$?
      echo "Exit code captured: $exit_code"
      if [ $exit_code -eq 0 ]; then
        echo "Test succeeded."
        mkdir -p ${INTERNAL_PIPELINES_DATA_ROOT}/logs/$CI_PIPELINE_ID
        cp log_TEST-$TEST_NAME.txt ${INTERNAL_PIPELINES_DATA_ROOT}/logs/$CI_PIPELINE_ID
      else
        echo "Test failed."
        mkdir -p ${INTERNAL_PIPELINES_DATA_ROOT}/quarantine/$CI_JOB_ID
        cp -r * ${INTERNAL_PIPELINES_DATA_ROOT}/quarantine/$CI_JOB_ID
        exit $exit_code
      fi

create_env:
  extends:
    - .testplan_enabled
    - .variables_testplan
    - .tags_bps_ci_rocky8
    - .get_test_plan
  script:
    - conda config --append envs_dirs ${INTERNAL_PIPELINES_DATA_ROOT}/conda_envs
    - |
      if conda info --envs | grep -q "pipeline-$CI_PIPELINE_ID"; then
        echo "Conda env already created"
      else
        echo "Creating conda env called pipeline-$CI_PIPELINE_ID"
        mkdir -p local_channel/noarch
        mkdir -p local_channel/linux-64
        find $CI_PROJECT_DIR/bps-dockerfiles/bundle -type f \( -name '*-py_0.tar.bz2' -o -name '*-py_0.conda' \) | awk -F/ '!seen[$NF]++ { system("cp \"" $0 "\" \"local_channel/noarch/\"") }'
        find $CI_PROJECT_DIR/bps-dockerfiles/bundle -type f \( -name '*-py[0-9]*_0.tar.bz2' -o -name '*-py[0-9]*_0.conda' -o -name '*-0.conda' \) | awk -F/ '!seen[$NF]++ { system("cp \"" $0 "\" \"local_channel/linux-64/\"") }'
        conda index ./local_channel
        conda config --prepend channels conda-forge
        conda config --prepend channels ${PWD}/local_channel
        conda create -y --prefix ${INTERNAL_PIPELINES_DATA_ROOT}/conda_envs/pipeline-$CI_PIPELINE_ID python=3.12 bps-l1_framing_processor bps-l1_processor bps-stack_processor bps-l2a_processor bps-l2b_fh_processor bps-l2b_fd_processor bps-l2b_agb_processor
        conda activate ${INTERNAL_PIPELINES_DATA_ROOT}/conda_envs/pipeline-$CI_PIPELINE_ID
        pip install -r ${INTERNAL_TEST_PLAN_ROOT}/test_plan/tools/scripts/requirements.txt
      fi
  needs:
    - job: bundle
      optional: true

test_installation:
  parallel:
    matrix:
      - TEST_NAME:
          - L1F-001   # L1 Framing Processor installation and setup
          - L1-001    # L1 Processor installation and setup
          - STA-001   # Stack Processor installation and setup
          - L2A-001   # L2a Processor installation and setup
          # TODO: to be added those for L2B
  before_script:
    - !reference [.get_test_plan, before_script]
  extends:
    - .testplan_enabled
    - .variables_testplan
    - .run_test
  needs:
    - job: create_env
    - job: bundle
      optional: true

ALL:
  parallel:
    matrix:
      - TEST_NAME:
          - ALL-001   # BPS processing chain execution (functional validation)
          - ALL-002   # BPS processing chain execution (scientific validation)
  before_script:
    - !reference [.get_test_plan, before_script]
  extends:
    - .testplan_enabled
    - .variables_testplan
    - .get_test_plan
    - .tags_bps_ci_rocky8
    - .run_test
  needs:
    - job: create_env
    - job: bundle
      optional: true

L1F_P:
  parallel:
    matrix:
      - TEST_NAME:
          - L1F-002   # Nominal L1 Framing Processor execution
          - L1F-003   # Processing of data containing gaps
  before_script:
    - !reference [.get_test_plan, before_script]
  extends:
    - .testplan_enabled
    - .variables_testplan
    - .get_test_plan
    - .tags_bps_ci_rocky8
    - .run_test
  needs:
    - job: create_env
    - job: bundle
      optional: true

L1_P__TEST-BPS-L1-003-009-010-011-024:
          # - L1-003   # Nominal L1 Processor execution (Stripmap mode)
          # - L1-009   # Analysis of L1 Pre-Processing step outputs
          # - L1-010   # Analysis of L1 Core-Processing step outputs
          # - L1-011   # Analysis of L1 Post-Processing step outputs
          # - L1-024   # Processing time performances verification
  extends:
    - .testplan_enabled
    - .variables_testplan
    - .get_test_plan
    - .tags_bps_ci_rocky8
  script:
    - mkdir -p ${INTERNAL_TEST_PLAN_ROOT}/test_plan/tools/install_dir
    - cp -r $CI_PROJECT_DIR/bps-dockerfiles/bundle ${INTERNAL_TEST_PLAN_ROOT}/test_plan/tools/install_dir
    - set +e
    - set -o pipefail
    - TEST_NAMES=("TEST-BPS-L1-003" "TEST-BPS-L1-009" "TEST-BPS-L1-010" "TEST-BPS-L1-011" "TEST-BPS-L1-024")
    - |
      for TEST_NAME in "${TEST_NAMES[@]}"; do
        cd ${INTERNAL_TEST_PLAN_ROOT}/test_plan/test_cases/$TEST_NAME
        ./run.bash 2>&1 | tee log_TEST-$TEST_NAME.txt; exit_code=$?
        echo "Exit code captured: $exit_code"
        if [ $exit_code -eq 0 ]; then
          echo "Test succeeded."
          mkdir -p ${INTERNAL_PIPELINES_DATA_ROOT}/logs/$CI_PIPELINE_ID
          cp log_TEST-$TEST_NAME.txt ${INTERNAL_PIPELINES_DATA_ROOT}/logs/$CI_PIPELINE_ID
        else
          echo "Test failed."
          mkdir -p ${INTERNAL_PIPELINES_DATA_ROOT}/quarantine/$CI_JOB_ID
          cp -r * ${INTERNAL_PIPELINES_DATA_ROOT}/quarantine/$CI_JOB_ID
          exit $exit_code
        fi
      done
  needs:
    - job: create_env
    - job: bundle
      optional: true

L1_P:
  parallel:
    matrix:
      - TEST_NAME:
          - L1-002   # Minimal L1 Processor execution (Stripmap mode)
          - L1-005   # Nominal L1 Processor execution (PARC mode)
          - L1-006   # Processing of whole input L0 slice
          - L1-007   # Processing of a selected ROI
          - L1-012   # RFI mitigation (Time and Frequency domain approaches) verification
          - L1-013   # Range compression (with various chirp sources) verification
          - L1-014   # Extended swath processing verification
          - L1-015   # Doppler Centroid estimation (Predefined, Geometry and Combined)
          - L1-016   # Azimuth resampling (including PRF changes management) verification
          - L1-017   # Ionosphere mitigation (slow- and high-varying cases) verification
          # - L1-018   # Autofocus verification --> skipped, autofocus not activated in operations
          - L1-019   # IRF analysis (on L1a and L1b) verification (ideal conditions)
          - L1-020   # IRF analysis (on L1a and L1b) verification (in presence of RFI
          - L1-021   # Phase preservation verification (ideal conditions)
          - L1-022   # NESN verification (ideal conditions)
          - L1-023   # NESN verification (in presence of RFI)
          - L1-025   # Processing of degraded/corrupted input L0 slice
          - L1-026   # Processing of incomplete input L0 slice/output L1 frame
          - L1-027   # Processing without input L0 Monitoring product
          - L1-028   # Processing with not-nominal input acquisition timeline and timing parameters
          - L1-029   # Processing with not-nominal input auxiliary files and internal resources
          - L1-031   # Processing of input L0 slice containing missing lines
          - L1-032   # Processing of input L0 slice containing strong artefacts
          # - L1-033   # Cross validation with GPP --> skipped, replaced by a dedicated TN
  before_script:
    - !reference [.get_test_plan, before_script]
  extends:
    - .testplan_enabled
    - .variables_testplan
    - .get_test_plan
    - .tags_bps_ci_rocky8
    - .run_test
  needs:
    - job: create_env
    - job: bundle
      optional: true

STA_P:
  parallel:
    matrix:
      - TEST_NAME:
          - STA-002   # Minimal Stack Processor execution (INT phase)
          # - STA-003   # Nominal Stack Processor execution (TOM phase) --> skipped, requires manual execution for stop-and-resume check step
          # - STA-004   # Multiple processing instances --> skipped, requires manual execution
          - STA-005   # Primary image selection verification
          - STA-006   # Coregistration (from geometry and from data) verification
          - STA-010   # IRF analysis verification (ideal conditions)
          # - STA-011   # Processing time performances verification --> skipped, hardware specific
          - STA-012   # Processing of degraded/corrupted input L1 frame
          - STA-013   # Processing of partial input L1 frame
          - STA-014   # Processing of incomplete set of input L1 frames
          # - STA-016   # IRF analysis verification (in presence of RFI and ionosphere and of baseline errors, independently) --> skipped, not expected to pass even in L1_P
          - STA-017   # Processing of not-nominal set of input L1 frames
          - STA-018   # Phase calibration by SKP verification
          - STA-020   # DEM LUTs Upsampling
          - STA-021   # Saving of SKP and IoS phase screen in NetCDF files
  before_script:
    - !reference [.get_test_plan, before_script]
  extends:
    - .testplan_enabled
    - .variables_testplan
    - .get_test_plan
    - .tags_bps_ci_rocky8
    - .run_test
  needs:
    - job: create_env
    - job: bundle
      optional: true

