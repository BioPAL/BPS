[project]
name = "bps-stack_processor"
description = "Biomass Stack Processor."
authors = [{ name = "Aresys S.R.L.", email = "info@aresys.it" }]
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE.txt" }
dependencies = [
    "arepytools>=1.8.1",
    "arepyextras-runner",
    "bps-common==4.4.5",
    "bps-stack_pre_processor==4.4.5",
    "bps-stack_coreg_processor==4.4.5",
    "bps-stack_cal_processor==4.4.5",
    "bps-transcoder==4.4.5",
    "click",
    "gdal>=3.10,<3.11",
    "numpy",
    "scipy",
]
dynamic = ["version"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",

]

[project.scripts]
bps_stack_processor = "bps.stack_processor.__main__:main"

[project.optional-dependencies]
dev = ["nox", "ruff==0.15.7"]
test = ["unittest-xml-reporting", "coverage"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "bps/stack_processor/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = ["bps"]

[tool.hatch.build.targets.wheel]
only-include = ["bps"]
