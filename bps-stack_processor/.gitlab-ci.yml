stages:
  - analysis
  - test
  - build
  - deploy

workflow:
  rules:
    - when: always

variables:
  GIT_DEPTH: 1

.tags_manylinux2014:
  tags: ["manylinux2014"]

.tags_eo_deploy:
  tags: ["eo", "deploy"]

xsd_alignment:
  stage: analysis
  needs: []
  extends:
    - .tags_manylinux2014
  script:
    - cd $SUBPROJECT
    - python3.12 -m pip install nox
    - python3.12 -m nox -s check_xsd

ruff:
  stage: analysis
  needs: []
  extends:
    - .tags_manylinux2014
  script:
    - cd $SUBPROJECT
    - python3.12 -m pip install nox
    - python3.12 -m nox -s ruff

fawlty_deps:
  stage: analysis
  needs: []
  extends:
    - .tags_manylinux2014
  script:
    - cd $SUBPROJECT
    - python3.12 -m pip install nox
    - python3.12 -m nox -s fawlty_deps

format:
  stage: analysis
  needs: []
  extends:
    - .tags_manylinux2014
  script:
    - cd $SUBPROJECT
    - python3.12 -m pip install nox
    - python3.12 -m nox -s format_check

sdist:
  stage: build
  needs: []
  extends:
    - .tags_manylinux2014
  script:
    - cd $SUBPROJECT
    - python3.12 -m pip install nox
    - python3.12 -m nox -s build_sdist
  artifacts:
    expire_in: 2 weeks
    paths:
      - $SUBPROJECT/dist/*.tar.gz

wheel:
  stage: build
  needs: []
  extends:
    - .tags_manylinux2014
  script:
    - cd $SUBPROJECT
    - python3.12 -m pip install nox
    - python3.12 -m nox -s build_wheel
  artifacts:
    expire_in: 2 weeks
    paths:
      - $SUBPROJECT/dist/*.whl

deploy:
  stage: deploy
  extends:
    - .tags_eo_deploy
  rules:
    - if: "$CI_COMMIT_TAG"
  script:
    - eval "$(ssh-agent -s)"
    - for file in ${SUBPROJECT}/dist/*; do
      eo_pgp-signme ${file} > ${file}.asc &&
      ./.gitlab/ci/dashboard-copy.sh ${file} develop/bps/bps-stack_processor/archive &&
      ./.gitlab/ci/dashboard-copy.sh ${file}.asc develop/bps/bps-stack_processor/archive;
      done
