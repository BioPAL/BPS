schema_version: 1

context:
  name: bps-stack_processor
  version: 4.6.0.dev0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  path: ../dist/bps_stack_processor-${{ version }}.tar.gz
  use_gitignore: false

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - bps_stack_processor = bps.stack_processor.__main__:main

requirements:
  host:
    - python >=3.12
    - hatchling
    - pip
  run:
    - python >=3.12
    - numpy
    - arepytools >=1.9.0
    - click
    - xsdata
    - arepyextras-runner
    - bps-common ==${{ version }}
    - bps-stack_binaries ==${{ version }}
    - bps-stack_pre_processor ==${{ version }}
    - bps-stack_coreg_processor ==${{ version }}
    - bps-stack_cal_processor ==${{ version }}
    - bps-transcoder ==${{ version }}
    - perseo-core >=1.0.0
    - gdal >=3.13,<3.14

tests:
  - python:
      imports:
        - bps
      pip_check: true

about:
  summary: Biomass Stack Processor.
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - Aresys srl
