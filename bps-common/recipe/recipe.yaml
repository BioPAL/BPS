schema_version: 1

context:
  name: bps-common
  version: 4.6.0.dev0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  path: ../dist/bps_common-${{ version }}.tar.gz
  use_gitignore: false

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.12
    - hatchling
    - pip
  run:
    - python >=3.12
    - arepyextras-runner
    - numpy
    - arepytools >=1.9.0
    - xsdata
    - xmlschema
    - gdal >=3.13,<3.14
    - perseo-core >=1.0.0

tests:
  - python:
      imports:
        - bps
      pip_check: true

about:
  summary: Biomass common package.
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - Aresys srl
