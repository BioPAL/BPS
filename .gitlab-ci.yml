spec:
  inputs:
    bps-full-build:
      type: boolean
      default: false
      description: Enable full build jobs such as packaging, docker and downstream release tasks.
    test-plan-version:
      type: string
      default: ""
      description: Test plan version to use when the full build flow enables test plan generation.
    bps-enable-l1-test:
      type: boolean
      default: false
      description: Enable the L1 integration test suites.
    bps-enable-stack-test:
      type: boolean
      default: false
      description: Enable the stack integration test suites.
    bps-enable-win10-unittest:
      type: boolean
      default: false
      description: Propagate Windows unit test enablement to downstream project pipelines.
---

stages:
  - subproject
  - integration_tests
  - conda-packaging
  - conda-integration-tests
  - deploy
  - docker
  - testplan

workflow:
  rules:
    - when: always

variables:
  L1_EXECUTABLES_LNX: "${EXECUTABLES_PATH}/L1_executables_lnx_2026-0513-3dceeb5a-c159c2e3.tgz"
  L1_EXECUTABLES_WIN: "${EXECUTABLES_PATH}/L1_executables_win_2026-0513-3dceeb5a-c159c2e3.zip"
  STACK_EXECUTABLES_LNX: "${EXECUTABLES_PATH}/Stack_executables_lnx_2026-0513-3dceeb5a.tgz"
  STACK_EXECUTABLES_WIN: "${EXECUTABLES_PATH}/Stack_executables_win_2026-0513-3dceeb5a.zip"

include:
  - project: 'biomass-bps/ci-variables'
    ref: main
    file: '/variables.yml'
  - local: ".conda-packaging-ci.yml"
  - local: ".docker-ci.yml"
  - local: ".testplan-ci.yml"
    inputs:
      bps-full-build: $[[ inputs.bps-full-build ]]
      test-plan-version: $[[ inputs.test-plan-version ]]

.enable_deploy:
  rules:
    - if: "$CI_COMMIT_TAG =~ /^bps-v.*/"

.full_build:
  rules:
    - if: "$CI_COMMIT_TAG =~ /^bps-v.*/"
    - if: '"$[[ inputs.bps-full-build ]]" == "true"'

.testing_rules:
  rules:
    - if: "$CI_COMMIT_TAG =~ /^bps-v.*/"
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"

.enable_l1:
  rules:
    - !reference [.testing_rules, rules]
    - if: '"$[[ inputs.bps-enable-l1-test ]]" == "true"'

.enable_stack:
  rules:
    - !reference [.testing_rules, rules]
    - if: '"$[[ inputs.bps-enable-stack-test ]]" == "true"'

.tags_rocky8_conda:
  tags: ["eo", "rocky8", "conda"]

.tags_win10_conda:
  tags: ["eo", "win10", "conda"]

.tags_deploy:
  tags: ["eo", "deploy"]

.subproject:
  stage: subproject
  variables:
    SUBPROJECT: $CI_JOB_NAME
    BPS_ENABLE_WIN10_UNITTEST: '$[[ inputs.bps-enable-win10-unittest ]]'
  trigger:
    strategy: mirror

bps-common:
  extends: .subproject
  trigger:
    include: bps-common/.gitlab-ci.yml
  rules:
    - if: '"$[[ inputs.bps-full-build ]]" == "true"'
      when: never
    - if: "$CI_COMMIT_TAG =~ /^bps-v.*/"
    - if: "$CI_COMMIT_TAG == null"
      changes:
        - .gitlab-ci.yml
        - bps-common/*
        - bps-common/**/*

