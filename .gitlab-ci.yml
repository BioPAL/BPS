    INTEGRATION_TEST: "test/integration/suite/e2e"

l1_rocky8_py312:
  extends:
    - .integration_test_rocky8
    - .enable_l1
  variables:
    PYTHON: "3.12"
    INTEGRATION_TEST: "test/integration/suite/l1"

stack_rocky8_py312:
  extends:
    - .integration_test_rocky8
    - .enable_stack
  variables:
    PYTHON: "3.12"
    INTEGRATION_TEST: "test/integration/suite/stack/basic"

.integration_test_win10:
  stage: integration_tests
  needs: []
  rules:
    - if: '"$[[ inputs.bps-full-build ]]" == "true"'
      when: never
    - when: always
  extends:
    - .tags_win10_conda
  script:
    - $legacyProfile = Join-Path $HOME 'Documents\WindowsPowerShell\profile.ps1'; if (Test-Path $legacyProfile) { . $legacyProfile } elseif (Test-Path $PROFILE) { . $PROFILE }
    - $ProgressPreference = 'SilentlyContinue'
    - Invoke-WebRequest -UseBasicParsing -Uri "$env:L1_EXECUTABLES_WIN" -OutFile "L1_executables.zip"
    - Expand-Archive -Path "L1_executables.zip" -DestinationPath .
    - Invoke-WebRequest -UseBasicParsing -Uri "$env:STACK_EXECUTABLES_WIN" -OutFile "Stack_Executables.zip"
    - Expand-Archive -Path "Stack_Executables.zip" -DestinationPath .
    - conda create --name test -y python=${PYTHON} gdal=3.10
    - conda activate test
    - $L1_BIN_FOLDER = $("${pwd}" + "\L1_executables")
    - $env:PATH = $($env:PATH + ";" + $L1_BIN_FOLDER)
    - $STACK_BIN_FOLDER = $("${pwd}" + "\Stack_Executables")
    - $env:PATH = $($env:PATH + ";" + $STACK_BIN_FOLDER)
    - python -m pip install -e ./bps-common -e ./bps-transcoder
    - python -m pip install -e ./bps-l1_pre_processor -e ./bps-l1_core_processor -e ./bps-l1_processor
    - python -m pip install -e ./bps-stack_processor -e ./bps-stack_cal_processor -e ./bps-stack_coreg_processor -e ./bps-stack_pre_processor
    - python -m pip install -e ./bps-l2a_processor -e ./bps-l2b_fd_processor -e ./bps-l2b_fh_processor -e ./bps-l2b_agb_processor
    - python -m pip install -r test/requirements.txt
    - mkdir tdir
    - (Get-Content test/integration/config/win10.toml) -replace '\$\{DATASET_PATH_WIN\}', $env:DATASET_PATH_WIN | Set-Content test/integration/config/win10.toml
    - python -m arepyextras.test --config test/integration/config/win10.toml test run ${INTEGRATION_TEST}
  retry: 2

base_win10_py312:
  extends:
    - .integration_test_win10
  variables:
    PYTHON: "3.12"
    INTEGRATION_TEST: "test/integration/suite/base"

l1_win10_py312:
  extends:
    - .integration_test_win10
    - .enable_l1
  variables:
    PYTHON: "3.12"
    INTEGRATION_TEST: "test/integration/suite/l1"

stack_win10_py312:
  extends:
    - .integration_test_win10
    - .enable_stack
  variables:
    PYTHON: "3.12"
    INTEGRATION_TEST: "test/integration/suite/stack/win_tests"

.conda_integration_test_rocky8_base:
  stage: conda-integration-tests
  extends:
    - .tags_rocky8_conda
    - .full_build
  script:
    - mkdir $HOME/EOCFI_LIBS && cd $HOME/EOCFI_LIBS
    - curl $EOCFI_LIBS_LNX -o BPS-EOCFI-4.27-CPPLIB-LINUX64_LEGACY.tar.gz && tar -xvzf BPS-EOCFI-4.27-CPPLIB-LINUX64_LEGACY.tar.gz && rm BPS-EOCFI-4.27-CPPLIB-LINUX64_LEGACY.tar.gz
    - export LD_LIBRARY_PATH=${HOME}/EOCFI_LIBS:${LD_LIBRARY_PATH} && cd -
    - conda create --name test python=${PYTHON} conda-build
    - conda activate test
    - python -m conda_index ./local_channel
    - conda config --set custom_channels.${INTERNAL_CONDA_CHANNEL_NAME} "$INTERNAL_CONDA_CHANNEL_URL"
    - conda config --prepend channels conda-forge
    - conda config --prepend channels ${INTERNAL_CONDA_CHANNEL_NAME}
    - conda config --prepend channels ${PWD}/local_channel
    - conda install --strict-channel-priority bps-l1_framing_processor bps-l1_processor bps-stack_processor bps-l2a_processor bps-l2b_fd_processor bps-l2b_fh_processor bps-l2b_agb_processor
    - conda list
    - python -m pip install -r test/requirements.txt
    - python -c "import os; f='test/integration/config/linux.toml'; content=open(f).read().replace('\${DATASET_PATH_LNX}', os.environ['DATASET_PATH_LNX']); open(f,'w').write(content)"
    - python -m arepyextras.test --config test/integration/config/linux.toml test run test/integration/suite/base
    - python -m arepyextras.test --config test/integration/config/linux.toml test run test/integration/suite/stack/basic/bps-stack-normal.py:test_bps_sta_002_tom_reduced_data_nominal
  needs:
    - job: bps-common-conda
      optional: true
    - job: bps-transcoder-conda
      optional: true
    - job: bps-l1_framing_processor-conda
      optional: true
    - job: bps-l1_pre_processor-conda
      optional: true
    - job: bps-l1_core_processor-conda
      optional: true
    - job: bps-l1_processor-conda
      optional: true
    - job: bps-stack_pre_processor-conda
      optional: true
    - job: bps-stack_coreg_processor-conda
      optional: true
    - job: bps-stack_cal_processor-conda
      optional: true
    - job: bps-stack_processor-conda
      optional: true
    - job: bps-l2a_processor-conda
      optional: true
    - job: bps-l2b_fd_processor-conda
      optional: true
    - job: bps-l2b_fh_processor-conda
      optional: true
    - job: bps-l2b_agb_processor-conda
      optional: true
  artifacts:
    expire_in: 2 weeks
    paths:
      - ./*/dist/*.conda
      - ./local_channel

base_rocky8_conda_py312:
  extends: .conda_integration_test_rocky8_base
  variables:
    PYTHON: "3.12"

base_rocky8_conda_py313:
  extends: .conda_integration_test_rocky8_base
  variables:
    PYTHON: "3.13"

base_rocky8_conda_py314:
  extends: .conda_integration_test_rocky8_base
  variables:
    PYTHON: "3.14"

conda_deploy:
  stage: deploy
  extends:
    - .tags_deploy
    - .enable_deploy
  script:
    - eval "$(ssh-agent -s)"
    - |
      for file in ./*/dist/*.conda; do
        eo_pgp-signme ${file} > ${file}.asc
        if [[ $file == *"py_0.conda" ]]; then
          ./.gitlab/ci/dashboard-copy.sh ${file} ${INTERNAL_CONDA_CHANNEL_PATH}/noarch &&
          ./.gitlab/ci/dashboard-copy.sh ${file}.asc ${INTERNAL_CONDA_CHANNEL_PATH}/noarch;
        else
          ./.gitlab/ci/dashboard-copy.sh ${file} ${INTERNAL_CONDA_CHANNEL_PATH}/linux-64 &&
          ./.gitlab/ci/dashboard-copy.sh ${file}.asc ${INTERNAL_CONDA_CHANNEL_PATH}/linux-64;
        fi
      done
    - ./.gitlab/ci/conda-forge-update.sh ${INTERNAL_CONDA_CHANNEL_PATH}
  needs:
    - job: base_rocky8_conda_py312
