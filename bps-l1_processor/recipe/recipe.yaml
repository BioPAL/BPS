schema_version: 1

context:
  name: bps-l1_processor
  version: 4.6.0.dev0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  path: ../dist/bps_l1_processor-${{ version }}.tar.gz
  use_gitignore: false

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - bps_l1_processor = bps.l1_processor.__main__:main

requirements:
  host:
    - python >=3.12
    - hatchling
    - pip
  run:
    - python >=3.12
    - numpy
    - arepytools >=1.9.0
    - click
    - xsdata
    - arepyextras-runner
    - matplotlib-base
    - unlzw3
    - shapely
    - pyproj
    - netcdf4
    - bps-common ==${{ version }}
    - bps-l1_binaries ==${{ version }}
    - bps-l1_pre_processor ==${{ version }}
    - bps-l1_core_processor ==${{ version }}
    - bps-transcoder ==${{ version }}
    - perseo-core >=1.0.0

tests:
  - python:
      imports:
        - bps
      pip_check: true

about:
  summary: Biomass L1 Processor.
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - Aresys srl
