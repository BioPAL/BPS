{#- Custom top banner: return link + announcement. -#}
{%- if theme_announcement %}
<aside class="bps-top-banner d-print-none" aria-label="Site navigation">
  <div class="bps-top-banner__inner">
    <a class="bps-return-link" href="{{ site_home_url }}" title="Return to Biomass DISC website">
      <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
      <span>Biomass DISC website</span>
    </a>
    <span class="bps-top-banner__sep" aria-hidden="true"></span>
    <span class="bps-top-banner__message">{{ theme_announcement }}</span>
  </div>
</aside>
{%- endif %}
