#
# Local BPS run configuration.
# Replace every occurrence of <BPS_ROOT> with the absolute path to your
# bps-work directory (e.g. /home/yourname/bps-work or /Users/yourname/bps-work).

[TEMPLATE_JO]
L1F    = <BPS_ROOT>/docs/tutorials/run-bps-locally/CONFIGURATION_FILE/JO_TEMPLATE/BIO_L1F_P_TEMPLATE_JobOrder.xml
L1     = <BPS_ROOT>/docs/tutorials/run-bps-locally/CONFIGURATION_FILE/JO_TEMPLATE/BIO_L1_P_TEMPLATE_JobOrder.xml
STA    = <BPS_ROOT>/docs/tutorials/run-bps-locally/CONFIGURATION_FILE/JO_TEMPLATE/BIO_STA_P_TEMPLATE_JobOrder.xml
L2A    = <BPS_ROOT>/docs/tutorials/run-bps-locally/CONFIGURATION_FILE/JO_TEMPLATE/BIO_L2A_P_ALL_TEMPLATE_JobOrder.xml
L2A_FH = <BPS_ROOT>/docs/tutorials/run-bps-locally/CONFIGURATION_FILE/JO_TEMPLATE/BIO_L2A_P_FH_TEMPLATE_JobOrder.xml

[AUX_STATIC]
# Installed with the BPS bundle under <conda-env>/share/bps/internal_resources/.
# Either symlink that folder or update the paths below.
DEM = <BPS_ROOT>/bps/internal_resources/DEM
FNF = <BPS_ROOT>/bps/internal_resources/FNF
GMF = <BPS_ROOT>/bps/internal_resources/GMF
IRI = <BPS_ROOT>/bps/internal_resources/IRI

[AUX]
# Downloaded from https://biomass-disc.info/release_note for your BPS version.
AUX_DEFAULT_DIR = <BPS_ROOT>/docs/tutorials/run-bps-locally/CONFIGURATION_FILE/AUX_443
AUX_USER_DIR    = <BPS_ROOT>/docs/tutorials/run-bps-locally/CONFIGURATION_FILE/AUX_USER
