.conda_build_setup:
  extends:
    - .full_build
  image: condaforge/miniforge3
  script:
    - BPS_CHANNEL=${PWD}/local_channel
    - mkdir -p ${BPS_CHANNEL}/linux-64
    - mkdir -p ${BPS_CHANNEL}/noarch
    - cd ${BPSPROJECT}
    - |
      if [[ "$BUILD_SDIST" == "true" ]]; then
        conda install -y rattler-build python-build
        python -m build --sdist
      else
        conda install -y rattler-build
      fi
    - python -m conda_index ${BPS_CHANNEL}
    - |
      rattler-build build --recipe recipe/recipe.yaml --output-dir build_dir \
        --channel "file://${BPS_CHANNEL}" \
        --channel "${INTERNAL_CONDA_CHANNEL_URL%/}/${INTERNAL_CONDA_CHANNEL_NAME}" \
        --channel conda-forge
    - |
      mkdir -p dist
      for file in build_dir/*/*.conda; do
        subdir=$(basename "$(dirname "$file")")
        mkdir -p "${BPS_CHANNEL}/${subdir}"
        cp "$file" dist
        cp "$file" "${BPS_CHANNEL}/${subdir}/"
      done
    - cd -
    - python -m conda_index ${BPS_CHANNEL}
    - find "${BPS_CHANNEL}" -type d -exec chmod 755 {} +
    - find "${BPS_CHANNEL}" -type f -exec chmod 644 {} +
  timeout: 20 minutes
  retry: 2
  artifacts:
    expire_in: 2 weeks
    paths:
      - ./*/dist/*.conda
      - ./local_channel

#Conda Packaging Stage 1

bps-common-conda:
  stage: conda-packaging
  needs: []
  extends:
    - .conda_build_setup
  variables:
    BPSPROJECT: bps-common
    BUILD_SDIST: "true"

bps-l1_binaries-conda:
  stage: conda-packaging
  needs: []
  extends:
    - .conda_build_setup
  before_script:
    - apt-get update && apt-get install -y curl
    - curl -s $L1_EXECUTABLES_LNX -o L1_executables.tgz
    - tar -xzf L1_executables.tgz
    - mkdir -p bps-l1_binaries/bin
    - cp L1_executables/BiomassL0ImportPreProc bps-l1_binaries/bin
    - cp L1_executables/BPSL1CoreProcessor bps-l1_binaries/bin
    - cp L1_executables/IonosphericHeightIRI20Estimator bps-l1_binaries/bin
    - cp L1_executables/GenericGeocoder bps-l1_binaries/bin
    - mkdir -p bps-l1_binaries/lib
    - cp L1_executables/libareapplib_common.so bps-l1_binaries/lib
    - cp L1_executables/libare_parsing.so bps-l1_binaries/lib
    - cp L1_executables/libare_sarbase.so bps-l1_binaries/lib
    - cp L1_executables/libare_core.so bps-l1_binaries/lib
    - cp L1_executables/libareapplib_ionosphericCalibration.so bps-l1_binaries/lib
    - cp L1_executables/libareapplib_rfimitigator.so bps-l1_binaries/lib
    - cp L1_executables/libare_focus.so bps-l1_binaries/lib
  variables:
    BPSPROJECT: bps-l1_binaries
    BUILD_SDIST: "false"

bps-stack_binaries-conda:
  stage: conda-packaging
  needs: []
  extends:
    - .conda_build_setup
  before_script:
    - apt-get update && apt-get install -y curl
    - curl -s $STACK_EXECUTABLES_LNX -o Stack_Executables.tgz
    - tar -xzf Stack_Executables.tgz
    - export PATH=${PWD}/Stack_Executables:${PATH}
    - mkdir -p bps-stack_binaries/bin
    - cp Stack_Executables/BPSStackProcessor bps-stack_binaries/bin
    - mkdir -p bps-stack_binaries/lib
    - cp Stack_Executables/libareapplib_common.so bps-stack_binaries/lib
    - cp Stack_Executables/libare_parsing.so bps-stack_binaries/lib
    - cp Stack_Executables/libare_sarbase.so bps-stack_binaries/lib
    - cp Stack_Executables/libare_core.so bps-stack_binaries/lib
    - cp Stack_Executables/libare_focus.so bps-stack_binaries/lib
  variables:
    BPSPROJECT: bps-stack_binaries
    BUILD_SDIST: "false"

bps-l1-framing-processor-libs-conda:
  stage: conda-packaging
  needs: []
  extends:
    - .conda_build_setup
  before_script:
    - apt-get update && apt-get install -y curl
    - mkdir $HOME/EOCFI_LIBS
    - cd $HOME/EOCFI_LIBS
    - curl $EOCFI_LIBS_LNX -o BPS-EOCFI-4.20-CPPLIB-LINUX64_LEGACY.tar.gz && tar -xvzf BPS-EOCFI-4.20-CPPLIB-LINUX64_LEGACY.tar.gz && rm BPS-EOCFI-4.20-CPPLIB-LINUX64_LEGACY.tar.gz
    - cd -
    - mkdir -p bps-l1_framing_processor_libs/lib
    - cp $HOME/EOCFI_LIBS/* bps-l1_framing_processor_libs/lib/
  variables:
    BPSPROJECT: bps-l1_framing_processor_libs
    BUILD_SDIST: "false"

