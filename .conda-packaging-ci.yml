.conda_build_setup:
  extends:
    - .tags_rocky8_conda
  before_script:
    - mkdir -p local_channel/linux-64 && mkdir -p local_channel/noarch && python -m conda_index --verbose ./local_channel
    - python -m pip install build
    - conda config --set custom_channels.${INTERNAL_CONDA_CHANNEL_NAME} "$INTERNAL_CONDA_CHANNEL_URL"
    - conda config --prepend channels conda-forge
    - conda config --prepend channels ${INTERNAL_CONDA_CHANNEL_NAME}
    - conda config --prepend channels ${PWD}/local_channel
  script:
    - cd ${BPSPROJECT}
    - python -m build --sdist
    - conda build recipe --output-folder conda_build_dir
    - |
        for file in conda_build_dir/*/*.conda; do
          cp $file dist
          if [[ $file == *"py_0.conda" ]]; then
            cp $file ../local_channel/noarch
          else
            cp $file ../local_channel/linux-64
          fi
        done
    - cd - && python -m conda_index --verbose ./local_channel
  timeout: 20 minutes
  retry: 2
  artifacts:
    expire_in: 2 weeks
    paths:
      - ./*/dist/*.conda
      - ./local_channel

.conda_build_binaries_setup:
  extends:
    - .tags_rocky8_conda
  before_script:
    - mkdir -p ${BPSPROJECT}/dist
    - mkdir -p local_channel/linux-64 && mkdir -p local_channel/noarch && python -m conda_index --verbose ./local_channel
    - conda config --set custom_channels.${INTERNAL_CONDA_CHANNEL_NAME} "$INTERNAL_CONDA_CHANNEL_URL"
    - conda config --prepend channels conda-forge
    - conda config --prepend channels ${INTERNAL_CONDA_CHANNEL_NAME}
    - conda config --prepend channels ${PWD}/local_channel
  script:
    - cd ${BPSPROJECT}
    - conda build recipe --output-folder conda_build_dir
    - ls conda_build_dir/*/*.conda
    - |
        for file in conda_build_dir/*/*.conda; do
          cp $file dist
          if [[ $file == *"py_0.conda" ]]; then
            cp $file ../local_channel/noarch
          else
            cp $file ../local_channel/linux-64
          fi
        done
    - cd - && python -m conda_index --verbose ./local_channel
  timeout: 20 minutes
  retry: 2
  artifacts:
    expire_in: 2 weeks
    paths:
      - ./*/dist/*.conda
      - ./local_channel

.conda_packaging_rules:
  extends:
    - .full_build


#Conda Packaging Stage 1

bps-common-conda:
  stage: conda-packaging
  needs: []
  extends:
    - .conda_packaging_rules
    - .conda_build_setup
  variables:
    BPSPROJECT: bps-common

bps-l1_binaries-conda:
  stage: conda-packaging
  needs: []
  extends:
    - .conda_packaging_rules
    - .conda_build_binaries_setup
  before_script:
    - !reference [ .conda_build_binaries_setup, before_script ]
    - curl -s $L1_EXECUTABLES_LNX -o L1_executables.tgz
    - tar -xzf L1_executables.tgz
    - mkdir -p bps-l1_binaries/bin
    - cp L1_executables/BiomassL0ImportPreProc bps-l1_binaries/bin
    - cp L1_executables/BPSL1CoreProcessor bps-l1_binaries/bin
    - cp L1_executables/IonosphericHeightIRI20Estimator bps-l1_binaries/bin
    - mkdir -p bps-l1_binaries/lib
    - cp L1_executables/libareapplib_common.so bps-l1_binaries/lib
    - cp L1_executables/libare_parsing.so bps-l1_binaries/lib
    - cp L1_executables/libare_sarbase.so bps-l1_binaries/lib
    - cp L1_executables/libare_core.so bps-l1_binaries/lib
    - cp L1_executables/libareapplib_ionosphericCalibration.so bps-l1_binaries/lib
    - cp L1_executables/libareapplib_rfimitigator.so bps-l1_binaries/lib
    - cp L1_executables/libare_focus.so bps-l1_binaries/lib
  variables:
    BPSPROJECT: bps-l1_binaries

bps-stack_binaries-conda:
  stage: conda-packaging
  needs: []
  extends:
    - .conda_packaging_rules
    - .conda_build_binaries_setup
  before_script:
    - !reference [ .conda_build_binaries_setup, before_script ]
    - curl -s $STACK_EXECUTABLES_LNX -o Stack_Executables.tgz
    - tar -xzf Stack_Executables.tgz
    - export PATH=${PWD}/Stack_Executables:${PATH}
    - mkdir -p bps-stack_binaries/bin
    - cp Stack_Executables/BPSStackProcessor bps-stack_binaries/bin
    - mkdir -p bps-stack_binaries/lib
    - cp Stack_Executables/libareapplib_common.so bps-stack_binaries/lib
    - cp Stack_Executables/libare_parsing.so bps-stack_binaries/lib
    - cp Stack_Executables/libare_sarbase.so bps-stack_binaries/lib
    - cp Stack_Executables/libare_core.so bps-stack_binaries/lib
    - cp Stack_Executables/libare_focus.so bps-stack_binaries/lib
  variables:
    BPSPROJECT: bps-stack_binaries

