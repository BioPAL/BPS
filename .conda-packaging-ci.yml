bps-l1_framing_processor-conda:
  stage: conda-packaging
  extends:
    - .conda_packaging_rules
    - .conda_build_setup
  before_script:
    - !reference [ .conda_build_setup, before_script ]
    - mkdir $HOME/EOCFI_LIBS && cd $HOME/EOCFI_LIBS
    - curl $EOCFI_LIBS_LNX -o BPS-EOCFI-4.20-CPPLIB-LINUX64_LEGACY.tar.gz && tar -xvzf BPS-EOCFI-4.20-CPPLIB-LINUX64_LEGACY.tar.gz && rm BPS-EOCFI-4.20-CPPLIB-LINUX64_LEGACY.tar.gz
    - export LD_LIBRARY_PATH=${HOME}/EOCFI_LIBS:${LD_LIBRARY_PATH} && cd -
  needs:
    - job: bps-common-conda
    - job: bps-transcoder-conda
  variables:
    BPSPROJECT: bps-l1_framing_processor

