schema_version: 1

context:
  name: bps-l2a_processor
  version: 4.6.0.dev0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  path: ../dist/bps_l2a_processor-${{ version }}.tar.gz
  use_gitignore: false

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - bps_l2a_processor = bps.l2a_processor.__main__:main

requirements:
  host:
    - python >=3.12
    - hatchling
    - pip
  run:
    - python >=3.12
    - numpy
    - arepytools >=1.9.0
    - click
    - numba >=0.57
    - numexpr
    - xsdata
    - netcdf4
    - py-opencv <4.14 headless*
    - bps-common ==${{ version }}
    - bps-transcoder ==${{ version }}
    - perseo-core >=1.0.0

tests:
  - python:
      imports:
        - bps
      pip_check: true

about:
  summary: Biomass L2a Processor.
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - Aresys srl
