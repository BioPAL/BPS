[project]
name = "bps-l2a_processor"
description = "Biomass L2a Processor."
authors = [{ name = "Aresys S.R.L.", email = "info@aresys.it" }]
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE.txt" }
dependencies = [
    "arepytools",
    "click",
    "gdal>=3.10,<3.11",
    "numba >= 0.57",
    "numpy",
    "numexpr",
    "netCDF4",
    "scipy",
    "opencv-python-headless<4.14",
    "bps-common==4.4.5",
    "bps-transcoder==4.4.5",
]
dynamic = ["version"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",

]

[project.scripts]
bps_l2a_processor = "bps.l2a_processor.__main__:main"

[project.optional-dependencies]
dev = ["nox", "ruff==0.15.7"]
test = ["unittest-xml-reporting", "coverage"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "bps/l2a_processor/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = ["bps"]

[tool.hatch.build.targets.wheel]
only-include = ["bps"]
