[project]
name = "bps-l1_pre_processor"
description = "Biomass L1 Pre Processor package."
authors = [{ name = "Aresys S.R.L.", email = "info@aresys.it" }]
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE.txt" }
dependencies = [
    "arepytools",
    "scipy>=1.10",
    "numpy",
    "netCDF4",
    "bps-common==4.4.3",
    "bps-transcoder==4.4.3",
]
dynamic = ["version"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",

]

[project.optional-dependencies]
dev = ["nox", "ruff==0.15.7"]
test = ["unittest-xml-reporting", "coverage"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "bps/l1_pre_processor/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = ["bps"]

[tool.hatch.build.targets.wheel]
only-include = ["bps"]
