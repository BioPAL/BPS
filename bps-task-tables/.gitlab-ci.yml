stages:
  - validation
  - deploy

workflow:
  rules:
    - when: always

.tags_deploy:
  tags: ["eo", "deploy"]

TaskTable_and_PMM_xml_validation:
  stage: validation
  image: python:3.14-slim-bookworm
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libxml2-utils
  script:
    - python3.14 scripts/validate_task_tables.py

deploy:
  stage: deploy
  extends:
    - .tags_deploy
  rules:
    - if: "$CI_COMMIT_TAG =~ /^bps-v.*/"
  before_script:
    - source bps-dockerfiles/common_variables.sh
  script:
    - delivery_dir=bps-tt-$BPS_VERSION
    - mkdir $BPS_VERSION
    - mkdir $delivery_dir
    - mv $SUBPROJECT/*_processor $delivery_dir
    - mv $SUBPROJECT/README.md $delivery_dir
    - GZIP=-1 tar -czf $BPS_VERSION/$delivery_dir.tar.gz $delivery_dir
    - eval "$(ssh-agent)"
    - cat "$DASHBOARD_PRIVATE_KEY" | base64 -d | ssh-add -
    - rsync --stats -r $BPS_VERSION $INTERNAL_RELEASES_FOLDER
  needs:
    - TaskTable_and_PMM_xml_validation
