schema_version: 1

context:
  name: bps-l1_geocoding_tool
  version: 4.6.0.dev0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  path: ../dist/bps_l1_geocoding_tool-${{ version }}.tar.gz
  use_gitignore: false

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - bps_l1_geocoding_tool = bps.l1_geocoding_tool.__main__:main

requirements:
  host:
    - python >=3.12
    - hatchling
    - pip
  run:
    - python >=3.12
    - arepytools >=1.8.1
    - arepyextras-copernicus_dem_extractor
    - arepyextras-runner
    - click
    - netcdf4
    - numpy
    - bps-transcoder ==${{ version }}
    - bps-l1_binaries ==${{ version }}

tests:
  - python:
      imports:
        - bps
      pip_check: true

about:
  summary: Biomass L1 Geocoding Tool package.
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - Aresys srl
